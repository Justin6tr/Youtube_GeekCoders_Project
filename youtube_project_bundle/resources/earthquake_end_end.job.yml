resources:
  jobs:
    Youtube_EarthQuake_End_End_Job:
      name: Youtube_EarthQuake_End_End_Job_Prod
      tasks:
        - task_key: Ingestion_Bronze
          notebook_task:
            notebook_path: ../src/notebooks/Ingestion_Bronze.ipynb
            base_parameters:
              catalog_name: ${var.catalog}
            source: WORKSPACE
        - task_key: Bronze_Silver_EarthQuake
          depends_on:
            - task_key: Ingestion_Bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.bronze_silver_earthquake_etl.id}
        - task_key: EarthQuake_Dashboard
          depends_on:
            - task_key: Bronze_Silver_EarthQuake
          dashboard_task:
            subscription: {}
            warehouse_id: af144637b509aa5b
            dashboard_id: 01f1a44a90bf127982eb4c90fe0a2ac5
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          # default: youtube_dev
          default: ${var.catalog}
      performance_target: PERFORMANCE_OPTIMIZED

